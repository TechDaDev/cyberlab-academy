components:
  securitySchemes:
    APIKeyCookie:
      type: apiKey
      in: cookie
      name: cyberlab_session
  schemas:
    CourseCreate:
      type: object
      additionalProperties: false
      required:
      - code
      - title
      - edition
      - planned_module_count
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 40
          pattern: ^[A-Z0-9-]+$
        title:
          type: string
          minLength: 3
          maxLength: 160
        edition:
          type: string
          minLength: 1
          maxLength: 40
        summary:
          type: string
          maxLength: 2000
          default: ''
        planned_module_count:
          type: integer
          minimum: 1
          maximum: 1000
    CoursePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
        summary:
          type: string
          maxLength: 2000
        planned_module_count:
          type: integer
          minimum: 1
          maximum: 1000
    CoursePublic:
      type: object
      required:
      - id
      - code
      - title
      - edition
      - status
      - planned_module_count
      - published_module_count
      - content_version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        title:
          type: string
        summary:
          type: string
        edition:
          type: string
        status:
          type: string
          enum:
          - draft
          - published
          - archived
        planned_module_count:
          type: integer
          minimum: 1
        published_module_count:
          type: integer
          minimum: 0
        content_version:
          type: integer
          minimum: 1
        published_at:
          type:
          - string
          - 'null'
          format: date-time
    ModuleCreate:
      type: object
      additionalProperties: false
      required:
      - sequence
      - title
      properties:
        sequence:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 3
          maxLength: 160
        summary:
          type: string
          maxLength: 2000
          default: ''
    ModulePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        sequence:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 3
          maxLength: 160
        summary:
          type: string
          maxLength: 2000
    ModulePublic:
      type: object
      required:
      - id
      - course_id
      - sequence
      - title
      - status
      properties:
        id:
          $ref: '#/components/schemas/Id'
        course_id:
          $ref: '#/components/schemas/Id'
        sequence:
          type: integer
        title:
          type: string
        summary:
          type: string
        status:
          type: string
          enum:
          - draft
          - published
          - archived
        published_at:
          type:
          - string
          - 'null'
          format: date-time
    ResourceInput:
      type: object
      additionalProperties: false
      required:
      - title
      - type
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 180
        type:
          type: string
          enum:
          - external_link
          - reference
          - download_reference
        external_url:
          type:
          - string
          - 'null'
          format: uri
        asset_reference:
          type:
          - string
          - 'null'
          maxLength: 250
    ObjectivePublic:
      type: object
      required:
      - sequence
      - text
      properties:
        sequence:
          type: integer
          minimum: 1
        text:
          type: string
    ResourcePublic:
      type: object
      required:
      - id
      - sequence
      - title
      - type
      properties:
        id:
          $ref: '#/components/schemas/Id'
        sequence:
          type: integer
        title:
          type: string
        type:
          type: string
          enum:
          - external_link
          - reference
          - download_reference
        external_url:
          type:
          - string
          - 'null'
          format: uri
        asset_reference:
          type:
